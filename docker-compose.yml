# EcoSort — serverul MySQL într-un container Docker.
#
#   docker compose up -d      pornește MySQL; la prima pornire creează baza din database/
#   docker compose down       oprește serverul (datele rămân în volumul ecosort-mysql)
#   docker compose down -v    oprește serverul și ȘTERGE baza de date
#
# Valorile vin din fișierul .env (același pe care îl citește aplicația).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Parola root e generată aleator (apare o singură dată în `docker compose logs mysql`);
      # aplicația nu o folosește.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      ECOSORT_DB_USER: ${ECOSORT_DB_USER:?Completați ECOSORT_DB_USER în .env}
      ECOSORT_DB_PASSWORD: ${ECOSORT_DB_PASSWORD:?Completați ECOSORT_DB_PASSWORD în .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      # Doar de pe acest calculator.
      - "${ECOSORT_DB_BIND:-127.0.0.1}:${ECOSORT_DB_PORT:-3306}:3306"
    volumes:
      - ecosort-mysql:/var/lib/mysql
      - ./database:/ecosort-db:ro
      - ./database/docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [ "iot" ]
    restart: unless-stopped
    environment:
      MQTT_ESP_PASSWORD: ${ECOSORT_MQTT_ESP_PASSWORD:-}
      MQTT_INGEST_PASSWORD: ${ECOSORT_MQTT_INGEST_PASSWORD:-}
    # Fișierul de parole se generează la fiecare pornire din .env: nu intră în Git.
    command:
      - sh
      - -c
      - |
        [ -n "$$MQTT_ESP_PASSWORD" ] && [ -n "$$MQTT_INGEST_PASSWORD" ] || { echo "Completați parolele MQTT în .env"; exit 1; }
        rm -f /mosquitto/config/passwd
        mosquitto_passwd -b -c /mosquitto/config/passwd esp32 "$$MQTT_ESP_PASSWORD"
        mosquitto_passwd -b /mosquitto/config/passwd ingest "$$MQTT_INGEST_PASSWORD"
        cp /mosquitto/acl.src /mosquitto/config/acl
        chown mosquitto:mosquitto /mosquitto/config/passwd /mosquitto/config/acl
        chmod 0700 /mosquitto/config/acl
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"          # accesibil din rețeaua locală: pe aici se conectează ESP32
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/acl.src:ro
      - ecosort-mosquitto:/mosquitto/data

  ingest:
    build: ./ingest
    profiles: [ "iot" ]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DB_HOST: mysql                    # numele serviciului, în rețeaua internă Docker
      DB_NAME: ${ECOSORT_DB_NAME:-ecosort}
      DB_USER: ${ECOSORT_DB_USER:-}
      DB_PASSWORD: ${ECOSORT_DB_PASSWORD:-}
      MQTT_HOST: mosquitto
      MQTT_USER: ingest
      MQTT_PASSWORD: ${ECOSORT_MQTT_INGEST_PASSWORD:-}
volumes:
  ecosort-mysql:
  ecosort-mosquitto:
